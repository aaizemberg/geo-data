<!DOCTYPE html>
<html>
<head>
    <title>Empresas en el Distrito Tecnológico en la Ciudad Autónoma de Buenos Aires</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
    <style>
        #map { height: 600px; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([-34.5, -58.5], 10);

        L.tileLayer('https://wms.ign.gob.ar/geoserver/gwc/service/tms/1.0.0/mapabase_topo@EPSG%3A3857@png/{z}/{x}/{-y}.png', {
            maxZoom: 18,
            attribution: '&copy; <a href="https://www.ign.gob.ar/">Instituto Geográfico Nacional</a>'
        }).addTo(map);
      
    // fetch('https://raw.githubusercontent.com/aaizemberg/geo-data/refs/heads/gh-pages/ar/caba/empresas_sdt.geojson')
    fetch('./empresas_sdt.geojson')
        .then(response => response.json())
        .then(data => {
            const geoJsonLayer = L.geoJSON(data, {
                onEachFeature: function(feature, layer) {
                    if (feature.properties && feature.properties.empresa) {
                        layer.bindPopup(feature.properties.empresa);
                    }
                }
            }).addTo(map);      
            map.fitBounds(geoJsonLayer.getBounds());
        })
        .catch(error => console.error('Error al cargar el archivo GeoJSON:', error));
  </script>
  </body>
</html>
